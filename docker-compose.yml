services:
  catedralx-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chalamandra-catedralx-v1
    # The image runs "catedral status" and exits; do not restart it as a daemon.
    restart: "no"
    shm_size: '256m'
    volumes:
      - catedralx-state:/home/catedralx/.local/state/chalamandra/catedralx
    environment:
      - PYTHONUNBUFFERED=1
      - CATEDRALX_SNAPSHOT_PATH=/dev/shm/cathedral_snapshot.json

volumes:
  catedralx-state:
    driver: local
