name: CatedralX tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install test dependencies (fail closed)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m pip check

      - name: Run all tests and record the actual count
        env:
          PYTHONPATH: ${{ github.workspace }}/elite
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider --junitxml=junit-catedralx.xml

      - name: Compile Python sources
        run: python -m compileall -q elite BIN tests

      - name: Preserve test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-catedralx-${{ github.run_id }}
          path: junit-catedralx.xml
          if-no-files-found: ignore
          retention-days: 14

  quality-and-security:
    name: Quality and security gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.17.3"

      - name: Ruff source lint gate
        run: ruff check --isolated --select E4,E7,E9,F --ignore E401,E402,E701,F401 --exclude tests elite BIN

      - name: Semgrep Python security scan
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src" \
            --volume "${RUNNER_TEMP}:/reports" \
            --workdir /src \
            semgrep/semgrep:1.182.1 \
            semgrep scan --config p/python --metrics=off --error \
              --json --output /reports/semgrep-catedralx.json .

      - name: Trivy filesystem security gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: ${{ runner.temp }}/trivy-catedralx-fs.json
          hide-progress: true
          timeout: 10m

      - name: Preserve security reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-catedralx-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/semgrep-catedralx.json
            ${{ runner.temp }}/trivy-catedralx-fs.json
          if-no-files-found: ignore
          retention-days: 14

  docker-build-and-smoke-test:
    name: Build and smoke-test the CLI image
    runs-on: ubuntu-24.04
    needs: [unit-tests, quality-and-security]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build canonical Docker image (fail closed)
        run: docker build --pull --file Dockerfile --tag catedralx:ci .

      - name: Trivy image vulnerability report (advisory baseline)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: catedralx:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: json
          output: ${{ runner.temp }}/trivy-catedralx-image.json
          hide-progress: true
          timeout: 10m

      - name: Preserve image security report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: image-security-catedralx-${{ github.run_id }}
          path: ${{ runner.temp }}/trivy-catedralx-image.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Smoke-test the image's default command
        run: docker run --rm --name catedralx-cli-smoke catedralx:ci
