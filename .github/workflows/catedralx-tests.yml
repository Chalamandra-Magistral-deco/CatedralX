name: CatedralX tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies (fail closed)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Run all tests and record the actual count
        env:
          PYTHONPATH: ${{ github.workspace }}/elite
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider --junitxml=junit-catedralx.xml

      - name: Compile Python sources
        run: python -m compileall -q elite BIN tests

      - name: Preserve test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-catedralx-${{ github.run_id }}
          path: junit-catedralx.xml
          if-no-files-found: ignore
          retention-days: 14

  docker-build-and-smoke-test:
    name: Build and smoke-test the CLI image
    runs-on: ubuntu-24.04
    needs: [unit-tests]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build canonical Docker image (fail closed)
        run: docker build --pull --file Dockerfile --tag catedralx:ci .

      - name: Smoke-test the image's default command
        run: docker run --rm --name catedralx-cli-smoke catedralx:ci
