name: CatedralX tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/elite
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q elite BIN tests

  docker-build-and-smoke-test:
    name: Build and smoke-test the CLI image
    runs-on: ubuntu-24.04
    needs: [unit-tests]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build canonical Docker image (fail closed)
        run: docker build --pull --file Dockerfile --tag catedralx:ci .

      - name: Smoke-test the image's default command
        run: docker run --rm --name catedralx-cli-smoke catedralx:ci
