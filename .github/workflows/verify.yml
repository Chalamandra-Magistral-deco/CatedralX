name: CatedralX verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catedralx-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-catedralx:
    name: Run complete CatedralX test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies (fail closed)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m pip check

      - name: Run all tests and record the actual count
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ".:elite"
        run: python -m pytest -q -p no:cacheprovider --junitxml=junit-catedralx.xml

      - name: Compile Python sources
        run: python -m compileall -q elite tests

      - name: Preserve test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-catedralx-${{ github.run_id }}
          path: junit-catedralx.xml
          if-no-files-found: ignore
          retention-days: 14

  docker-build-and-smoke-test:
    name: Build and smoke-test CatedralX image
    runs-on: ubuntu-latest
    needs: [test-catedralx]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the repository Dockerfile (fail closed)
        run: docker build --pull --tag catedralx:ci --file Dockerfile .

      - name: Run read-only status command
        run: docker run --rm catedralx:ci catedral status
