openapi: 3.1.0
info:
  title: Chalamandra Distribution Flow API
  version: 0.2.1
  summary: Publicación controlada de resultados aceptados.
  description: >-
    Contrato alineado con los handlers de Agents. Solo se distribuyen resultados
    con aceptación independiente y sincronización operativa confirmadas.
servers:
  - url: /
paths:
  /v1/subscriptions:
    post:
      operationId: createSubscription
      x-required-scope: subscriptions:write
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
      responses:
        '201':
          description: Suscripción creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '411': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listSubscriptions
      x-required-scope: subscriptions:read
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de suscripciones.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Subscription'
        '401': { $ref: '#/components/responses/Problem' }
  /v1/subscriptions/{subscription_id}:
    delete:
      operationId: deleteSubscription
      x-required-scope: subscriptions:write
      security:
        - bearerAuth: []
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204': { description: Suscripción deshabilitada. }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /internal/v1/distributions:
    post:
      operationId: publishAcceptedResult
      x-required-scope: results:publish
      x-required-subject: catedralx-service
      security:
        - serviceBearerAuth: []
      parameters:
        - name: traceparent
          in: header
          required: false
          description: >-
            W3C Trace Context. Si se envía y es válido, su trace_id debe coincidir
            con la traza del resultado aceptado.
          schema:
            type: string
            pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistributionRequest'
      responses:
        '202':
          description: Evento de distribución despachado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionAccepted'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: Resultado no aceptado, identidad o traza conflictiva, o TaskBus sin reconciliar. }
        '411': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de workload/service-to-service.
  schemas:
    SubscriptionRequest:
      type: object
      additionalProperties: false
      required: [endpoint_url, event_types]
      properties:
        endpoint_url:
          type: string
          format: uri
          pattern: '^https://'
        event_types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [result.accepted, result.blocked]
    Subscription:
      type: object
      required: [subscription_id, endpoint_url, event_types, status, created_at]
      properties:
        subscription_id: { type: string }
        endpoint_url: { type: string, format: uri }
        event_types:
          type: array
          items: { type: string }
        status: { type: string, enum: [enabled, disabled] }
        created_at: { type: string, format: date-time }
    DistributionRequest:
      type: object
      additionalProperties: false
      properties:
        candidate_id: { type: string, minLength: 1, maxLength: 256 }
        result_id: { type: string, minLength: 1, maxLength: 256 }
        event_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Opcional; el servidor lo genera si se omite.
        event_type:
          type: string
          const: result.accepted
          default: result.accepted
        trace_id:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: Opcional; si se envía debe coincidir con la traza de aceptación.
      anyOf:
        - required: [candidate_id]
        - required: [result_id]
      description: >-
        Debe incluir candidate_id o result_id. Si incluye ambos, deben ser iguales.
    DistributionAccepted:
      type: object
      additionalProperties: false
      required: [event_id, event_type, result_id, status, delivered_count, trace_id]
      properties:
        event_id: { type: string }
        event_type: { type: string, const: result.accepted }
        result_id: { type: string }
        status: { type: string, const: dispatched }
        delivered_count: { type: integer, minimum: 1 }
        trace_id: { type: string, pattern: '^[0-9a-f]{32}$' }
    WebhookEnvelope:
      type: object
      required: [event_id, event_type, occurred_at, result_id, trace_id]
      properties:
        event_id: { type: string }
        event_type: { type: string, const: result.accepted }
        occurred_at: { type: string, format: date-time }
        result_id: { type: string }
        trace_id: { type: string, pattern: '^[0-9a-f]{32}$' }
        result_url: { type: string, format: uri-reference }
  responses:
    Problem:
      description: Error JSON; el handler actual responde application/json.
