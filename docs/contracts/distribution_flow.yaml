openapi: 3.1.0
info:
  title: Chalamandra Distribution Flow API
  version: 0.1.0
  summary: Publicación controlada de resultados aceptados.
  description: Contrato propuesto para distribución.
servers:
  - url: /
paths:
  /v1/subscriptions:
    post:
      operationId: createSubscription
      x-required-scope: subscriptions:write
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionRequest' }
      responses:
        '201':
          description: Suscripción creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listSubscriptions
      x-required-scope: subscriptions:read
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lista de suscripciones.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Subscription' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/subscriptions/{subscription_id}:
    delete:
      operationId: deleteSubscription
      x-required-scope: subscriptions:write
      security: [{ bearerAuth: [] }]
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Suscripción deshabilitada. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /internal/v1/distributions:
    post:
      operationId: publishAcceptedResult
      x-required-scope: results:publish
      security: [{ serviceBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DistributionRequest' }
      responses:
        '202':
          description: Evento encolado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistributionAccepted' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: Resultado no aceptado o clave conflictiva. }
        '422': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de workload/service-to-service.
  schemas:
    SubscriptionRequest:
      type: object
      additionalProperties: false
      required: [endpoint_url, event_types]
      properties:
        endpoint_url:
          type: string
          format: uri
          pattern: '^https://'
        event_types:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [result.accepted, result.blocked] }
        enabled: { type: boolean, default: true }
    Subscription:
      type: object
      required: [subscription_id, endpoint_url, event_types, status, created_at]
      properties:
        subscription_id: { type: string }
        endpoint_url: { type: string, format: uri }
        event_types: { type: array, items: { type: string } }
        status: { type: string, enum: [enabled, disabled, pending_verification] }
        created_at: { type: string, format: date-time }
        last_delivery_at: { type: [string, 'null'], format: date-time }
    DistributionRequest:
      type: object
      additionalProperties: false
      required: [event_id, event_type, result_id, trace_id]
      properties:
        event_id: { type: string, minLength: 8, maxLength: 128 }
        event_type: { type: string, enum: [result.accepted, result.blocked] }
        result_id: { type: string }
        trace_id: { type: string }
        occurred_at: { type: string, format: date-time }
    DistributionAccepted:
      type: object
      required: [event_id, status, trace_id]
      properties:
        event_id: { type: string }
        status: { type: string, const: queued }
        trace_id: { type: string }
    WebhookEnvelope:
      type: object
      required: [event_id, event_type, occurred_at, result_id, trace_id]
      properties:
        event_id: { type: string }
        event_type: { type: string, enum: [result.accepted, result.blocked] }
        occurred_at: { type: string, format: date-time }
        result_id: { type: string }
        trace_id: { type: string }
        result_url: { type: string, format: uri-reference }
  responses:
    Problem:
      description: Error en formato problem+json.
