openapi: 3.1.0
info:
  title: Chalamandra Request Flow API
  version: 0.2.0
  summary: Flujo autenticado de trabajos financieros y consulta de resultados.
  description: >-
    Contrato alineado con los handlers de Agents en api/server.py.
    El análisis es informativo: no crea ni ejecuta órdenes financieras.
servers:
  - url: /
    description: URL base relativa al gateway configurado en el entorno.
paths:
  /v1/jobs:
    post:
      operationId: createJob
      summary: Crear un trabajo financiero validado
      x-required-scope: jobs:write
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
        - name: traceparent
          in: header
          required: false
          description: W3C Trace Context; el servidor genera una traza si no se proporciona una válida.
          schema:
            type: string
            pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
      responses:
        '202':
          description: Trabajo persistido en cola.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Idempotency-Key reutilizada con un payload distinto. }
  /v1/request:
    post:
      operationId: submitAgentRequest
      summary: Enviar una tarea general de solo lectura a Agents
      x-required-scope: jobs:write
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
        - name: traceparent
          in: header
          required: false
          description: W3C Trace Context; la traza se genera en el servidor si falta o es inválida.
          schema:
            type: string
            pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}    get:
      operationId: getJob
      summary: Consultar estado de un trabajo
      x-required-scope: jobs:read
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Estado actual del trabajo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/results/{result_id}:
    get:
      operationId: getResult
      summary: Recuperar un resultado candidato y su estado de aceptación
      x-required-scope: results:read
      security:
        - bearerAuth: []
      parameters:
        - name: result_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Resultado cuya aceptación independiente fue verificada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveredResult' }
        '202':
          description: Resultado existente pendiente de aceptación independiente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingVerification' }
        '403':
          description: Resultado rechazado o no autorizado para entrega.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:
    JobRequest:
      type: object
      additionalProperties: false
      required: [type, payload]
      properties:
        type:
          type: string
          enum: [financial_market_analysis, catedralx_economic_evaluation]
          description: >-
            Tipos explícitos admitidos por api.task_contracts. El alias
            financial_analysis está rechazado deliberadamente.
        payload:
          $ref: '#/components/schemas/FinancialAnalysisPayload'
    FinancialAnalysisPayload:
      type: object
      additionalProperties: false
      required: [historical_prices, current_price, observed_at, source, source_attestation]
      properties:
        asset: { type: string, minLength: 1, maxLength: 64 }
        historical_prices:
          type: array
          minItems: 30
          items: { type: number, exclusiveMinimum: 0 }
        current_price: { type: number, exclusiveMinimum: 0 }
        observed_at:
          type: string
          format: date-time
          description: Timestamp ISO-8601 con zona horaria.
        source:
          type: string
          minLength: 1
          maxLength: 256
          description: Identificador declarado de la fuente, incluido en la atestación firmada.
        source_attestation:
          type: object
          additionalProperties: false
          required: [key_id, signature]
          properties:
            key_id: { type: string, minLength: 1 }
            signature:
              type: string
              pattern: '^[0-9a-fA-F]{128}$'
              description: Firma Ed25519 hexadecimal de los campos canónicos de mercado.
        dynamic_constraints:
          type: object
          additionalProperties: false
          properties:
            reinvestment_surplus: { type: number }
            entropy_rate: { type: number }
            entropy_time_scale: { type: number }
            loop_gain: { type: number }
            signal_count: { type: integer, minimum: 0 }
            optimal_signal_count: { type: integer, minimum: 0 }
            exposure: { type: number }
            max_exposure: { type: number }
            resilience: { type: number }
            minimum_resilience: { type: number }
        central_dimensions_bp:
          type: object
          additionalProperties: false
          properties:
            viability_bp: { type: integer, minimum: 0, maximum: 10000 }
            human_value_bp: { type: integer, minimum: 0, maximum: 10000 }
            distribution_bp: { type: integer, minimum: 0, maximum: 10000 }
            resilience_bp: { type: integer, minimum: 0, maximum: 10000 }
            evidence_bp: { type: integer, minimum: 0, maximum: 10000 }
    AgentRequest:
      type: object
      additionalProperties: false
      required: [objective, permissions]
      properties:
        objective:
          type: string
          minLength: 1
          maxLength: 8000
          not:
            enum: [financial_analysis, catedralx_economic_proposal_review]
          description: >-
            Tipo de tarea general. Los análisis financieros usan /v1/jobs;
            las propuestas económicas autorizadas requieren el endpoint interno.
        payload:
          type: object
          additionalProperties: true
        success_criteria:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 1000 }
        permissions:
          type: object
          additionalProperties: false
          required: [allowed_tools, side_effects]
          properties:
            allowed_tools:
              type: array
              maxItems: 0
              description: El handler bloquea herramientas hasta disponer de clasificación verificada de efectos.
              items: { type: string, minLength: 1, maxLength: 128 }
            side_effects:
              type: string
              enum: [none, read_only]
    AgentRequestAccepted:
      type: object
      additionalProperties: false
      required: [run_id, task_id, status, trace_id, idempotent_replay]
      properties:
        run_id: { type: string }
        task_id: { type: string }
        status: { type: string, const: queued }
        trace_id: { type: string, pattern: '^[0-9a-f]{32}      type: object
      additionalProperties: false
      required: [job_id, status, trace_id, accepted_at]
      properties:
        job_id: { type: string }
        status: { type: string, const: queued }
        trace_id: { type: string, minLength: 32, maxLength: 32 }
        accepted_at: { type: string, format: date-time }
    JobStatus:
      type: object
      additionalProperties: false
      required: [job_id, status, trace_id, updated_at, result_id, reason_code, message]
      properties:
        job_id: { type: string }
        status:
          type: string
          enum: [queued, running, candidate, blocked, failed, accepted, rejected]
        trace_id: { type: string }
        updated_at: { type: string, format: date-time }
        result_id: { type: [string, 'null'] }
        reason_code: { type: [string, 'null'] }
        message: { type: [string, 'null'] }
    PendingVerification:
      type: object
      additionalProperties: false
      required: [status, message]
      properties:
        status: { type: string, const: pending_verification }
        message: { type: string }
    DeliveredResult:
      type: object
      required: [delivery_status, acceptance]
      properties:
        delivery_status: { type: string, const: accepted }
        acceptance:
          type: object
          required: [outcome]
          properties:
            outcome: { type: string, const: accepted }
            decision_id: { type: [string, 'null'] }
            verifier_id: { type: [string, 'null'] }
            decided_at: { type: [string, 'null'], format: date-time }
            trace_id: { type: [string, 'null'] }
      additionalProperties: true
  responses:
    BadRequest:
      description: Solicitud mal formada o contrato de tarea inválido.
    Unauthorized:
      description: JWT ausente, inválido o sin scope requerido.
    NotFound:
      description: Recurso inexistente.

      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentRequest' }
      responses:
        '202':
          description: Tarea persistida en TaskBus.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRequestAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Idempotency-Key reutilizada con un payload distinto. }
  /v1/jobs/{job_id}:
    get:
      operationId: getJob
      summary: Consultar estado de un trabajo
      x-required-scope: jobs:read
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Estado actual del trabajo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/results/{result_id}:
    get:
      operationId: getResult
      summary: Recuperar un resultado candidato y su estado de aceptación
      x-required-scope: results:read
      security:
        - bearerAuth: []
      parameters:
        - name: result_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Resultado cuya aceptación independiente fue verificada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveredResult' }
        '202':
          description: Resultado existente pendiente de aceptación independiente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingVerification' }
        '403':
          description: Resultado rechazado o no autorizado para entrega.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
