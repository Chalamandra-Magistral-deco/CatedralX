openapi: 3.1.0
info:
  title: CatedralX Orchestration Flow Internal API
  version: 0.1.0
  summary: Orquestación dirigida por CatedralX y ejecución de tareas por workers.
  description: Contrato interno. No exponer a Internet.
servers:
  - url: /
paths:
  /internal/v1/orchestration/runs:
    post:
      operationId: startOrchestrationRun
      x-required-scope: orchestration:run
      security: [{ serviceBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrchestrationTrigger' }
      responses:
        '202':
          description: Ciclo aceptado y planificado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunAccepted' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { description: Dedupe key ya usada. }
        '422': { $ref: '#/components/responses/Problem' }
  /internal/v1/orchestration/runs/{run_id}:
    get:
      operationId: getOrchestrationRun
      x-required-scope: orchestration:read
      security: [{ serviceBearerAuth: [] }]
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Estado del ciclo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunStatus' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /internal/v1/tasks/{task_id}/results:
    post:
      operationId: submitCandidateResult
      x-required-scope: tasks:complete
      security: [{ serviceBearerAuth: [] }]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateResult' }
      responses:
        '202':
          description: Resultado candidato registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateResultAccepted' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: Tarea ya completada o clave conflictiva. }
        '422': { $ref: '#/components/responses/Problem' }
  /internal/v1/orchestration/runs/{run_id}/acceptance:
    post:
      operationId: recordAcceptanceDecision
      x-required-scope: acceptance:write
      security: [{ serviceBearerAuth: [] }]
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptanceDecision' }
      responses:
        '201':
          description: Decisión registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptanceRecorded' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: Conflicto con evidencia o decisión previa. }
        '422': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    serviceBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    OrchestrationTrigger:
      type: object
      additionalProperties: false
      required: [trigger_id, source, objective, success_criteria, permissions, trace_id]
      properties:
        trigger_id: { type: string, minLength: 8, maxLength: 128 }
        source: { type: string, enum: [scheduler, verified_condition, authorized_manual] }
        objective: { type: string, minLength: 1, maxLength: 4000 }
        context_ref: { type: [string, 'null'] }
        success_criteria:
          type: array
          minItems: 1
          items: { type: string, minLength: 1, maxLength: 1000 }
        deadline_seconds: { type: integer, minimum: 1, maximum: 3600 }
        max_tasks: { type: integer, minimum: 1, maximum: 50 }
        permissions:
          type: object
          additionalProperties: false
          required: [allowed_tools, side_effects]
          properties:
            allowed_tools: { type: array, uniqueItems: true, maxItems: 32, items: { type: string, minLength: 1, maxLength: 128 } }
            side_effects: { type: string, enum: [none, read_only, approved_scoped], description: "approved_scoped permanece bloqueado hasta que exista evidencia de aprobación verificable; herramientas sin clasificación de efectos no se ejecutan" }
        trace_id: { type: string }
    TaskContract:
      type: object
      additionalProperties: false
      required: [task_id, run_id, objective, required_tools, execution_policy, success_criteria, deadline_at, trace_id]
      properties:
        task_id: { type: string }
        run_id: { type: string }
        objective: { type: string }
        required_tools: { type: array, uniqueItems: true, items: { type: string } }
        execution_policy:
          type: object
          additionalProperties: false
          required: [allowed_tools, side_effects]
          properties:
            allowed_tools: { type: array, uniqueItems: true, items: { type: string } }
            side_effects: { type: string, enum: [none, read_only, approved_scoped] }
        success_criteria: { type: array, minItems: 1, items: { type: string } }
        deadline_at: { type: string, format: date-time }
        context_ref: { type: [string, 'null'] }
        trace_id: { type: string }
    EvidenceRecord:
      type: object
      additionalProperties: false
      required: [evidence_id, kind, source, observed_at, description]
      properties:
        evidence_id: { type: string }
        kind: { type: string, enum: [input, observation, calculation, test, external_source, contradiction] }
        source: { type: string }
        observed_at: { type: string, format: date-time }
        digest: { type: [string, 'null'] }
        description: { type: string }
        artifact_ref: { type: [string, 'null'] }
    CandidateResult:
      type: object
      additionalProperties: false
      required: [candidate_id, result_id, worker_id, status, summary, evidence, assumptions, contradictions, trace_id, lease_token]
      properties:
        candidate_id: { type: string, minLength: 1 }
        result_id: { type: [string, 'null'] }
        worker_id: { type: string, minLength: 1 }
        status: { type: string, enum: [candidate, blocked, failed] }
        summary: { type: string }
        evidence: { type: array, items: { $ref: '#/components/schemas/EvidenceRecord' } }
        assumptions: { type: array, items: { type: string } }
        contradictions: { type: array, items: { type: string } }
        tests_performed: { type: array, items: { type: string } }
        limitations: { type: array, items: { type: string } }
        trace_id: { type: string, minLength: 1 }
        lease_token: { type: string, minLength: 1 }
    CandidateResultAccepted:
      type: object
      required: [candidate_id, verification_status, trace_id]
      properties:
        candidate_id: { type: string }
        verification_status: { type: string, const: pending }
        trace_id: { type: string }
    AcceptanceDecision:
      type: object
      additionalProperties: false
      required: [decision_id, candidate_id, outcome, criteria_checked, reasons, verifier_id, evidence_digest, signature_algorithm, signature, decided_at, trace_id]
      properties:
        decision_id: { type: string }
        candidate_id: { type: string }
        outcome: { type: string, enum: [accepted, rejected, needs_more_evidence, blocked] }
        criteria_checked: { type: array, items: { type: string } }
        reasons: { type: array, minItems: 1, items: { type: string } }
        missing_evidence: { type: array, items: { type: string } }
        verifier_id: { type: string }
        evidence_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 del candidato y su paquete de evidencia.
        signature_algorithm: { type: string, const: Ed25519 }
        signature:
          type: string
          format: byte
          description: Firma Ed25519 codificada en Base64 sobre la decisión y el evidence_digest.
        decided_at: { type: string, format: date-time }
        trace_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
    AcceptanceRecorded:
      type: object
      required: [decision_id, outcome, recorded_at, trace_id]
      properties:
        decision_id: { type: string }
        outcome: { type: string, enum: [accepted, rejected, needs_more_evidence, blocked] }
        recorded_at: { type: string, format: date-time }
        trace_id: { type: string }
    RunAccepted:
      type: object
      required: [run_id, status, trace_id]
      properties:
        run_id: { type: string }
        status: { type: string, const: queued }
        trace_id: { type: string }
    RunStatus:
      type: object
      required: [run_id, status, trace_id, updated_at, task_ids, task_statuses]
      properties:
        run_id: { type: string }
        status: { type: string, enum: [queued, executing, awaiting_acceptance, accepted, completed, completed_with_errors, blocked, failed] }
        task_ids: { type: array, items: { type: string } }
        task_statuses:
          type: array
          items: { type: string, enum: [queued, running, candidate, blocked, failed, accepted] }
        updated_at: { type: string, format: date-time }
        trace_id: { type: string }
  responses:
    Problem:
      description: Error en formato problem+json.
