openapi: 3.1.0
info:
  title: CatedralX Orchestration Flow Internal API
  version: 0.2.0
  summary: Orquestación dirigida por CatedralX, ejecución por workers y aceptación independiente.
  description: >-
    Contrato interno alineado con las rutas y payloads de api/server.py en Agents.
    No exponer las rutas internas a Internet.
servers:
  - url: /
paths:
  /internal/v1/orchestration/runs:
    post:
      operationId: startOrchestrationRun
      x-required-scope: orchestration:run
      x-required-subject: catedralx-service
      security: [{ serviceBearerAuth: [] }]
      parameters:
        - name: traceparent
          in: header
          required: false
          description: W3C Trace Context. La traza se genera en el servidor si falta o es inválida.
          schema:
            type: string
            pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrchestrationTrigger' }
      responses:
        '202':
          description: Trabajo persistido en TaskBus.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunAccepted' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { description: Clave de idempotencia conflictiva. }
  /internal/v1/orchestration/runs/{run_id}:
    get:
      operationId: getOrchestrationRun
      x-required-scope: orchestration:read
      security: [{ serviceBearerAuth: [] }]
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Estado agregado de las tareas del ciclo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunStatus' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /internal/v1/tasks/{task_id}/results:
    post:
      operationId: submitCandidateResult
      x-required-scope: tasks:complete
      security: [{ serviceBearerAuth: [] }]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateResultSubmission' }
      responses:
        '202':
          description: Resultado candidato registrado y pendiente de verificación.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateResultAccepted' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: Lease inválido, expirado o tarea ya completada. }
  /v1/acceptance:
    post:
      operationId: recordAcceptanceDecision
      x-required-scope: acceptance:write
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptanceDecision' }
      responses:
        '201':
          description: Decisión firmada registrada y estado operativo reconciliado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptanceRecorded' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { description: Decisión conflictiva o estados de TaskBus aún no reconciliados. }
        '503': { description: Aceptación persistida; distribución pendiente de reintento. }
components:
  securitySchemes:
    serviceBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    OrchestrationTrigger:
      type: object
      additionalProperties: false
      required: [objective, permissions]
      description: >-
        El handler consume objective, payload, permissions y success_criteria.
        La traza autoritativa procede de traceparent, no de un trace_id enviado en el cuerpo.
        Para catedralx_economic_proposal_review se exige el subject catedralx-service.
      properties:
        objective: { type: string, minLength: 1, maxLength: 8000 }
        payload:
          type: object
          additionalProperties: true
        success_criteria:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 1000 }
        permissions:
          type: object
          additionalProperties: false
          required: [allowed_tools, side_effects]
          properties:
            allowed_tools:
              type: array
              maxItems: 0
              description: >-
                Actualmente el handler bloquea cualquier herramienta solicitada porque
                no hay clasificación de efectos verificada para este endpoint.
              items: { type: string, minLength: 1, maxLength: 128 }
            side_effects:
              type: string
              enum: [none, read_only]
    CandidateResultSubmission:
      type: object
      additionalProperties: false
      required: [candidate_id, result_id, worker_id, status, summary, evidence, assumptions, contradictions, trace_id, lease_token]
      properties:
        candidate_id: { type: string, minLength: 1 }
        result_id: { type: [string, 'null'] }
        worker_id: { type: string, minLength: 1 }
        status: { type: string, enum: [candidate, blocked, failed] }
        summary: { type: string }
        evidence: { type: array, items: { $ref: '#/components/schemas/EvidenceRecord' } }
        assumptions: { type: array, items: { type: string } }
        contradictions: { type: array, items: { type: string } }
        tests_performed: { type: array, items: { type: string } }
        limitations: { type: array, items: { type: string } }
        trace_id: { type: string, minLength: 1 }
        lease_token: { type: string, minLength: 1 }
    EvidenceRecord:
      type: object
      additionalProperties: true
      required: [evidence_id, kind, source, observed_at, description]
      properties:
        evidence_id: { type: string }
        kind: { type: string, enum: [input, observation, calculation, test, external_source, contradiction, decision_result, authorized_business_cycle] }
        source: { type: string }
        observed_at: { type: [string, 'null'], format: date-time }
        digest: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        description: { type: string }
    CandidateResultAccepted:
      type: object
      required: [candidate_id, verification_status, trace_id]
      properties:
        candidate_id: { type: string }
        verification_status: { type: string, const: pending }
        trace_id: { type: string }
    AcceptanceDecision:
      type: object
      additionalProperties: false
      required: [decision_id, candidate_id, outcome, criteria_checked, reasons, verifier_id, evidence_digest, signature_algorithm, signature, decided_at, trace_id]
      properties:
        decision_id: { type: string }
        candidate_id: { type: string }
        outcome: { type: string, enum: [accepted, rejected] }
        criteria_checked: { type: array, items: { type: string } }
        reasons: { type: array, items: { type: string } }
        missing_evidence: { type: array, items: { type: string } }
        verifier_id: { type: string }
        evidence_digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 del candidato y su paquete de evidencia.
        signature_algorithm: { type: string, const: Ed25519 }
        signature:
          type: string
          pattern: '^[0-9a-fA-F]{128}$'
          description: Firma Ed25519 hexadecimal de la decisión y el evidence_digest.
        trace_id: { type: string, pattern: '^[0-9a-f]{32}$' }
    AcceptanceRecorded:
      type: object
      required: [decision_id, outcome]
      properties:
        decision_id: { type: string }
        outcome: { type: string, enum: [accepted, rejected] }
        idempotent_replay: { type: boolean }
    RunAccepted:
      type: object
      required: [run_id, task_id, status, trace_id, idempotent_replay]
      properties:
        run_id: { type: string }
        task_id: { type: string }
        status: { type: string, const: queued }
        trace_id: { type: string, pattern: '^[0-9a-f]{32}$' }
        idempotent_replay: { type: boolean }
    RunStatus:
      type: object
      required: [run_id, status, trace_id, updated_at, task_ids, task_statuses]
      properties:
        run_id: { type: string }
        status: { type: string, enum: [executing, awaiting_acceptance, accepted, completed, completed_with_errors] }
        task_ids: { type: array, items: { type: string } }
        task_statuses:
          type: array
          items: { type: string, enum: [queued, running, candidate, blocked, failed, accepted, rejected, completed] }
        updated_at: { type: string, format: date-time }
        trace_id: { type: string, pattern: '^[0-9a-f]{32}$' }
  responses:
    Problem:
      description: Error devuelto por el handler en formato JSON.

          description: Firma Ed25519 hexadecimal de la decisión y el evidence_digest.
        decided_at: { type: string, format: date-time }
        trace_id: { type: string, pattern: '^[0-9a-f]{32}$' }
    AcceptanceRecorded:
      type: object
      required: [decision_id, outcome]
      properties:
        decision_id: { type: string }
        outcome: { type: string, enum: [accepted, rejected, needs_more_evidence, blocked] }
        idempotent_replay: { type: boolean }
    RunAccepted:
      type: object
      required: [run_id, task_id, status, trace_id, idempotent_replay]
      properties:
        run_id: { type: string }
        task_id: { type: string }
        status: { type: string, const: queued }
        trace_id: { type: string, pattern: '^[0-9a-f]{32}$' }
        idempotent_replay: { type: boolean }
    RunStatus:
      type: object
      required: [run_id, status, trace_id, updated_at, task_ids, task_statuses]
      properties:
        run_id: { type: string }
        status: { type: string, enum: [executing, awaiting_acceptance, accepted, completed, completed_with_errors] }
        task_ids: { type: array, items: { type: string } }
        task_statuses:
          type: array
          items: { type: string, enum: [queued, running, candidate, blocked, failed, accepted, rejected, completed] }
        updated_at: { type: string, format: date-time }
        trace_id: { type: string, pattern: '^[0-9a-f]{32}$' }
  responses:
    Problem:
      description: Error devuelto por el handler en formato JSON.

          description: Firma Ed25519 hexadecimal de la decisión y el evidence_digest.
        decided_at: { type: string, format: date-time }
        trace_id: { type: string, pattern: '^[0-9a-f]{32}$' }
    AcceptanceRecorded:
      type: object
      required: [decision_id, outcome]
      properties:
        decision_id: { type: string }
        outcome: { type: string, enum: [accepted, rejected, needs_more_evidence, blocked] }
        idempotent_replay: { type: boolean }
    RunAccepted:
      type: object
      required: [run_id, task_id, status, trace_id, idempotent_replay]
      properties:
        run_id: { type: string }
        task_id: { type: string }
        status: { type: string, const: queued }
        trace_id: { type: string, pattern: '^[0-9a-f]{32}$' }
        idempotent_replay: { type: boolean }
    RunStatus:
      type: object
      required: [run_id, status, trace_id, updated_at, task_ids, task_statuses]
      properties:
        run_id: { type: string }
        status: { type: string, enum: [executing, awaiting_acceptance, accepted, completed, completed_with_errors] }
        task_ids: { type: array, items: { type: string } }
        task_statuses:
          type: array
          items: { type: string, enum: [queued, running, candidate, blocked, failed, accepted, rejected, completed] }
        updated_at: { type: string, format: date-time }
        trace_id: { type: string, pattern: '^[0-9a-f]{32}$' }
  responses:
    Problem:
      description: Error devuelto por el handler en formato JSON.

          description: Firma Ed25519 hexadecimal de la decisión y el evidence_digest.
        decided_at: { type: string, format: date-time }
        trace_id: { type: string, pattern: '^[0-9a-f]{32}$' }
    AcceptanceRecorded:
      type: object
      required: [decision_id, outcome]
      properties:
        decision_id: { type: string }
        outcome: { type: string, enum: [accepted, rejected, needs_more_evidence, blocked] }
        idempotent_replay: { type: boolean }
    RunAccepted:
      type: object
      required: [run_id, task_id, status, trace_id, idempotent_replay]
      properties:
        run_id: { type: string }
        task_id: { type: string }
        status: { type: string, const: queued }
        trace_id: { type: string, pattern: '^[0-9a-f]{32}$' }
        idempotent_replay: { type: boolean }
    RunStatus:
      type: object
      required: [run_id, status, trace_id, updated_at, task_ids, task_statuses]
      properties:
        run_id: { type: string }
        status: { type: string, enum: [executing, awaiting_acceptance, accepted, completed, completed_with_errors] }
        task_ids: { type: array, items: { type: string } }
        task_statuses:
          type: array
          items: { type: string, enum: [queued, running, candidate, blocked, failed, accepted, rejected, completed] }
        updated_at: { type: string, format: date-time }
        trace_id: { type: string, pattern: '^[0-9a-f]{32}$' }
  responses:
    Problem:
      description: Error devuelto por el handler en formato JSON.
